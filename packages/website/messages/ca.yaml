SourcePageLockup:
  pageTitle: Mostra el codi font
  pageSubtitle: Fes un cop d'ull a com s'ha creat aquest lloc web

  summaryHeading: Aquest lloc web és de codi obert
  summaryParagraph1: |
    Tens curiositat per saber com està fet? Tot és a la vista: des de l'arquitectura fins a la lògica dels components i l'estil. És una manera excel·lent d'entendre com abordo la resolució de problemes, els sistemes de disseny i el desenvolupament front-end.
  summaryParagraph2: |
    Tant si busques inspiració, com si revises la qualitat del codi o simplement t'interessa la pila tecnològica — fes-hi una ullada.

  sourceCodeTitle: Codi font
  sourceCodeDescription: Navega pel codi font d'aquest lloc web.

  designSystemTitle: Sistema de disseny
  designSystemDescription: Interactua amb cada component de manera aïllada mitjançant Storybook.

