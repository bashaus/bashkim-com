HomeOpenSource:
  title: Codi obert
  paragraph1: |
    T'agrada el que veus? He preparat un desglossament de les eines i la tecnologia que fan funcionar aquest lloc, perquè puguis veure entre bastidors com s'ha unit tot.
  paragraph2: |
    Tant si tens curiositat per les opcions de disseny, els marcs de treball o simplement vols veure què implica construir un lloc com aquest, aquí en trobaràs tots els detalls.
  learnMoreButtonLabel: Més informació

  primaryBrowserTitle: bashkim.com
  flippedBrowserTitle: view-source:bashkim.com

