SourcePageLockup:
  pageTitle: Ver código fuente
  pageSubtitle: Echa un vistazo a cómo se ha creado este sitio web

  summaryHeading: Este sitio web es de código abierto
  summaryParagraph1: |
    ¿Tienes curiosidad por saber cómo está construido? Todo está a la vista: desde la arquitectura hasta la lógica de los componentes y los estilos. Es una excelente manera de entender cómo abordo la resolución de problemas, los sistemas de diseño y el desarrollo front-end.
  summaryParagraph2: |
    Ya sea que estés explorando en busca de inspiración, revisando la calidad del código o simplemente interesado en la pila tecnológica, échale un vistazo.

  sourceCodeTitle: Código fuente
  sourceCodeDescription: Explora el código fuente de este sitio web.

  designSystemTitle: Sistema de diseño
  designSystemDescription: Interactúa con cada componente de forma aislada a través de Storybook.

