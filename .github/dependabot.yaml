# @see https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    open-pull-requests-limit: 15
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"

    schedule:
      interval: monthly

    cooldown:
      default-days: 7

    groups:
      eslint:
        group-by: dependency-name
        patterns:
          - "@eslint/*"
          - "eslint-*"
          - "eslint"

      prettier:
        group-by: dependency-name
        patterns:
          - "prettier"
          - "prettier-*"

      storybook:
        group-by: dependency-name
        patterns:
          - "@storybook/*"
          - "storybook"

      next:
        group-by: dependency-name
        patterns:
          - "@next/*"
          - "next"

      same-dependency-across-packages:
        group-by: dependency-name
